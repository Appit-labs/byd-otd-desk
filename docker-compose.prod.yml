services:
  mysql:
    image: mysql:8.0
    container_name: byd-otd-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-byd_otd_desk}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - byd-otd-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: byd-otd-backend-prod
    restart: unless-stopped
    ports:
      - "3005:3000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE:-byd_otd_desk}
      DB_SYNC: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-8h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3030}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
      APP_SECRET: ${APP_SECRET:-local-dev-app-secret-change-in-production}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3030}
      FALLBACK_SMTP_HOST: ${FALLBACK_SMTP_HOST:-smtp.resend.com}
      FALLBACK_SMTP_PORT: ${FALLBACK_SMTP_PORT:-465}
      FALLBACK_SMTP_USER: ${FALLBACK_SMTP_USER:-resend}
      FALLBACK_SMTP_PASS: ${FALLBACK_SMTP_PASS}
      FALLBACK_FROM_ADDRESS: ${FALLBACK_FROM_ADDRESS:-onboarding@resend.dev}
      FALLBACK_FROM_NAME: ${FALLBACK_FROM_NAME:-BYD OTD Tracker}
    networks:
      - byd-otd-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: byd-otd-frontend-prod
    restart: unless-stopped
    ports:
      - "3030:80"
    depends_on:
      - backend
    networks:
      - byd-otd-network

volumes:
  mysql_data:

networks:
  byd-otd-network:
    driver: bridge
